<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qarz</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b4fd6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Qarz">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f2f4f7;--surface:#fff;--ink:#121c27;--mute:#5d6b7a;--line:#dde2e8;--acc:#1b4fd6;--acc-ink:#fff;--bad:#b3261e;--ok:#14715b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--surface:#18212b;--ink:#e8edf2;--mute:#94a3b3;--line:#2a3643;--acc:#6b93ff;--acc-ink:#0b1220;--bad:#ff8a80;--ok:#5fd3b3}}
:root[data-theme="dark"]{--bg:#10161d;--surface:#18212b;--ink:#e8edf2;--mute:#94a3b3;--line:#2a3643;--acc:#6b93ff;--acc-ink:#0b1220;--bad:#ff8a80;--ok:#5fd3b3}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:28px;margin:4px 0 2px;letter-spacing:-.5px}
.sub{color:var(--mute);margin:0 0 18px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px}
input:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{width:100%;margin-top:22px;font:inherit;font-weight:700;background:var(--acc);color:var(--acc-ink);border:0;border-radius:12px;padding:15px;cursor:pointer}
.msg{margin-top:12px;color:var(--ok);font-weight:600;min-height:22px}
.err{color:var(--bad)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex}
nav button{flex:1;font:inherit;font-weight:600;background:none;border:0;color:var(--mute);height:52px;padding:0 8px;cursor:pointer}
nav button[aria-selected="true"]{color:var(--acc);box-shadow:inset 0 -3px 0 var(--acc)}
.search{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));background:var(--bg);padding:6px 0 10px;z-index:2}
.search input{border-radius:999px;padding-left:18px}
.total{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin:4px 2px 10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.amt{font-weight:800;color:var(--bad);white-space:nowrap}
.meta{color:var(--mute);font-size:14px;margin-top:4px;overflow-wrap:anywhere}
.meta a{color:var(--acc)}
.del{margin-top:10px;font:inherit;font-size:14px;font-weight:600;background:none;color:var(--bad);border:1.5px solid var(--bad);border-radius:10px;padding:8px 14px;cursor:pointer}
.del.sure{background:var(--bad);color:var(--surface)}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<nav role="tablist">
  <button role="tab" id="t1" aria-selected="true">Qarz kiritish</button>
  <button role="tab" id="t2" aria-selected="false">Qarzdorlar</button>
</nav>
<main>
<section id="p1">
  <h1>Qarz kiritish</h1>
  <p class="sub">Vaqt avtomatik yoziladi.</p>
  <label for="ism">Kimdan (ism)</label>
  <input id="ism" autocomplete="off" placeholder="Masalan: Aziz aka">
  <label for="tel">Telefon raqami</label>
  <input id="tel" type="tel" inputmode="tel" placeholder="+998 90 123 45 67">
  <label for="brend">Brend egasi</label>
  <input id="brend" autocomplete="off" placeholder="Masalan: Oltin Don">
  <label for="sum">Qarz summasi (soʻm)</label>
  <input id="sum" inputmode="numeric" placeholder="500 000">
  <button class="btn" id="save">Saqlash</button>
  <div class="msg" id="msg" role="status"></div>
</section>
<section id="p2" hidden>
  <h1>Qarzdorlar</h1>
  <div class="search"><input id="q" type="search" placeholder="Ism, brend yoki telefon boʻyicha qidirish" aria-label="Qidirish"></div>
  <div class="total"><span id="cnt"></span><span id="tot"></span></div>
  <div id="list"></div>
</section>
</main>
<script>
var KEY="qarz:list", data=[], $=function(i){return document.getElementById(i)};
function load(){try{data=JSON.parse(localStorage.getItem(KEY)||"[]")||[]}catch(e){data=[]}}
function store(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){return false}}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ")}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function when(t){var d=new Date(t),p=function(x){return String(x).padStart(2,"0")};return p(d.getDate())+"."+p(d.getMonth()+1)+"."+d.getFullYear()+", "+p(d.getHours())+":"+p(d.getMinutes())}
function tab(n){$("p1").hidden=n!==1;$("p2").hidden=n!==2;$("t1").setAttribute("aria-selected",n===1);$("t2").setAttribute("aria-selected",n===2);if(n===2)render();window.scrollTo(0,0)}
$("t1").onclick=function(){tab(1)};$("t2").onclick=function(){tab(2)};
$("sum").oninput=function(){var v=this.value.replace(/\D/g,"");this.value=v?fmt(v):""};
$("save").onclick=function(){
  var m=$("msg"),ism=$("ism").value.trim(),sum=parseInt($("sum").value.replace(/\D/g,""),10);
  m.className="msg";
  if(!ism||!sum){m.className="msg err";m.textContent="Ism va summani toʻldiring.";return}
  data.unshift({id:Date.now()+""+Math.floor(Math.random()*1000),ism:ism,tel:$("tel").value.trim(),brend:$("brend").value.trim(),sum:sum,t:Date.now()});
  if(!store()){m.className="msg err";m.textContent="Saqlab boʻlmadi. Brauzer xotirasi yopiq.";return}
  ["ism","tel","brend","sum"].forEach(function(i){$(i).value=""});
  m.textContent="Saqlandi: "+ism+", "+fmt(sum)+" soʻm";
  $("ism").focus();
};
$("q").oninput=render;
function render(){
  var q=$("q").value.trim().toLowerCase(),L=$("list"),arm=null;
  var res=data.filter(function(x){return !q||(x.ism+" "+x.brend+" "+x.tel).toLowerCase().indexOf(q)>-1});
  var s=res.reduce(function(a,x){return a+x.sum},0);
  $("cnt").textContent=res.length+" ta yozuv";$("tot").textContent="Jami: "+fmt(s)+" soʻm";
  if(!res.length){L.innerHTML='<div class="empty">'+(data.length?"Hech narsa topilmadi.":"Hali qarz kiritilmagan.")+'</div>';return}
  L.innerHTML=res.map(function(x){
    return '<div class="item"><div class="row"><div class="name">'+esc(x.ism)+'</div><div class="amt">'+fmt(x.sum)+' soʻm</div></div>'+
    '<div class="meta">'+(x.brend?'Brend: '+esc(x.brend)+'<br>':'')+(x.tel?'Tel: <a href="tel:'+esc(x.tel.replace(/[^\d+]/g,""))+'">'+esc(x.tel)+'</a><br>':'')+'Vaqt: '+when(x.t)+'</div>'+
    '<button class="del" data-id="'+x.id+'">Oʻchirish</button></div>'}).join("");
}
$("list").onclick=function(e){
  var b=e.target.closest(".del");if(!b)return;
  if(!b.classList.contains("sure")){b.classList.add("sure");b.textContent="Aniq oʻchirilsinmi?";setTimeout(function(){if(b.isConnected){b.classList.remove("sure");b.textContent="Oʻchirish"}},4000);return}
  data=data.filter(function(x){return x.id!==b.dataset.id});store();render();
};
load();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
